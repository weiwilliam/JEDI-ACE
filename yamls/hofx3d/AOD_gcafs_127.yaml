time window:
  begin: define_every_cycle
  length: PT6H
geometry:
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 96
  halo: 1
  io:
    latitude south to north: false
  groups:
  - variables:
    - mass_fraction_of_dust001_in_air
    - mass_fraction_of_dust002_in_air
    - mass_fraction_of_dust003_in_air
    - mass_fraction_of_dust004_in_air
    - mass_fraction_of_dust005_in_air
    - mass_fraction_of_sea_salt001_in_air
    - mass_fraction_of_sea_salt002_in_air
    - mass_fraction_of_sea_salt003_in_air
    - mass_fraction_of_sea_salt004_in_air
      #- mass_fraction_of_sea_salt005_in_air
    - mass_fraction_of_hydrophobic_organic_carbon_in_air
    - mass_fraction_of_hydrophilic_organic_carbon_in_air
    - mass_fraction_of_hydrophobic_black_carbon_in_air
    - mass_fraction_of_hydrophilic_black_carbon_in_air
    - mass_fraction_of_sulfate_in_air
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - water_vapor_mixing_ratio_wrt_dry_air
    - total_water_mixing_ratio_wrt_dry_air
    - cloud_ice_mixing_ratio_wrt_dry_air
    - cloud_liquid_water_mixing_ratio_wrt_dry_air
    - rain_mixing_ratio_wrt_dry_air
    - air_pressure_thickness
    - air_pressure
    - relative_humidity
    - water_vapor_mixing_ratio_wrt_moist_air_and_condensed_water
    - dlsvpdT
    - qsat
    - svp
    levels: 127
  - variables:
    - air_pressure_levels
    levels: 128
  model data:
    air_pressure_at_top_of_atmosphere_model: 1
    nLevels: 127
  alias:
  - in code: mass_fraction_of_dust001_in_air
    in file: dust1
  - in code: mass_fraction_of_dust002_in_air
    in file: dust2
  - in code: mass_fraction_of_dust003_in_air
    in file: dust3
  - in code: mass_fraction_of_dust004_in_air
    in file: dust4
  - in code: mass_fraction_of_dust005_in_air
    in file: dust5
  - in code: mass_fraction_of_sea_salt001_in_air
    in file: seas2
  - in code: mass_fraction_of_sea_salt002_in_air
    in file: seas3
  - in code: mass_fraction_of_sea_salt003_in_air
    in file: seas4
  - in code: mass_fraction_of_sea_salt004_in_air
    in file: seas5
      #- in code: mass_fraction_of_sea_salt005_in_air
      #  in file: seas5
  - in code: mass_fraction_of_hydrophobic_organic_carbon_in_air
    in file: oc1
  - in code: mass_fraction_of_hydrophilic_organic_carbon_in_air
    in file: oc2
  - in code: mass_fraction_of_hydrophobic_black_carbon_in_air
    in file: bc1
  - in code: mass_fraction_of_hydrophilic_black_carbon_in_air
    in file: bc2
  - in code: mass_fraction_of_sulfate_in_air
    in file: so4
  - in code: water_vapor_mixing_ratio_wrt_moist_air
    in file: spfh
  - in code: cloud_ice_mixing_ratio_wrt_dry_air
    in file: icmr
  - in code: cloud_liquid_water_mixing_ratio_wrt_dry_air
    in file: clwmr
  - in code: rain_mixing_ratio_wrt_dry_air
    in file: rwmr
  - in code: air_temperature
    in file: tmp
  - in code: air_pressure_thickness
    in file: dpres

state:
  state variables:
  - mass_fraction_of_dust001_in_air
  - mass_fraction_of_dust002_in_air
  - mass_fraction_of_dust003_in_air
  - mass_fraction_of_dust004_in_air
  - mass_fraction_of_dust005_in_air
  - mass_fraction_of_sea_salt001_in_air
  - mass_fraction_of_sea_salt002_in_air
  - mass_fraction_of_sea_salt003_in_air
  - mass_fraction_of_sea_salt004_in_air
    #- mass_fraction_of_sea_salt005_in_air
  - mass_fraction_of_hydrophobic_organic_carbon_in_air
  - mass_fraction_of_hydrophilic_organic_carbon_in_air
  - mass_fraction_of_hydrophobic_black_carbon_in_air
  - mass_fraction_of_hydrophilic_black_carbon_in_air
  - mass_fraction_of_sulfate_in_air
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_ice_mixing_ratio_wrt_dry_air
  - cloud_liquid_water_mixing_ratio_wrt_dry_air
  - rain_mixing_ratio_wrt_dry_air
  - air_pressure_thickness
  filepath: define_every_cycle
  netcdf extension: nc4
  date: define_every_cycle
  check dimensions: false
observations:
  get values:
    variable change:
      vader custom cookbook:
        air_pressure: ["AirPressure_A"]
        air_pressure_levels: ["AirPressureAtInterface_B"]
        relative_humidity: ["RelativeHumidity_A"]
        total_water_mixing_ratio_wrt_dry_air: ["TotalWaterMixingRatioWrtDryAir_A"]
        water_vapor_mixing_ratio_wrt_dry_air: ["WaterVaporMixingRatioWrtDryAir_C"]
        water_vapor_mixing_ratio_wrt_moist_air_and_condensed_water: ["WaterVaporMixingRatioWrtWetAir_A"]
        dlsvpdT: ["LogDerivativeSaturationVaporPressure_A"]
        qsat: ["SaturationSpecificHumidity_A"]
        svp: ["SaturationVaporPressure_A"]
      vader: true
  observers: observer/observer_tmp_gcafs.yaml
